services:
  # ==========================================================
  # Django ASGI unifié  (HTTP: admin + dashboard + API  ET
  #                      WebSocket: terminaux + dashboard temps réel)
  # Un seul serveur ASGI (daphne, mono-process) : l'EventBus/DeviceManager
  # en mémoire suffit au temps réel.
  # Écoute sur 8000 = port applicatif historique vers lequel le reverse-proxy
  # (Dokploy/Traefik) route déjà le domaine : AUCUNE reconfiguration du proxy.
  # Le port hôte 7788 est publié et redirigé vers ce même serveur pour les
  # terminaux (ws://IP:7788/ws/tm20/).
  # ==========================================================
  django:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: tm20_django
    # Les terminaux TM20 ne repondent pas aux frames ping WebSocket. Avec les
    # defauts de daphne (--ping-interval 20 / --ping-timeout 30), autobahn coupe
    # la connexion ~50 s apres le dernier message (close 1006) et le terminal
    # reconnecte en boucle. --ping-timeout 0 desactive cette coupure ; le ping
    # periodique est conserve pour maintenir NAT et reverse-proxy ouverts.
    # La detection des connexions mortes reste assuree cote applicatif par
    # TM20_CONNECTION_TIMEOUT (voir config/settings.py).
    command: daphne -b 0.0.0.0 -p 8000 --ping-interval 30 --ping-timeout 0 config.asgi:application
    ports:
      - "8000:8000"   # domaine / admin / dashboard (proxy -> 8000)
      - "7788:8000"   # terminaux TM20 (ws://IP:7788 -> même serveur ASGI)
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DEBUG: "0"
      LOG_DIR: /app/logs
      DATABASE_URL: ${DATABASE_URL:-postgres://tm20_user:tm20_password@postgres:5432/tm20_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      # Terminaux TM20. Sans ces lignes, les variables du `.env` de production
      # n'atteignent jamais le conteneur : .dockerignore exclut `.env` de
      # l'image et ce compose n'utilise pas `env_file`.
      TM20_TERMINAL_TIMEZONE: ${TM20_TERMINAL_TIMEZONE:-UTC}
      TM20_HEARTBEAT_INTERVAL: ${TM20_HEARTBEAT_INTERVAL:-30}
      TM20_CONNECTION_TIMEOUT: ${TM20_CONNECTION_TIMEOUT:-600}
      TM20_REQUIRE_WHITELIST: ${TM20_REQUIRE_WHITELIST:-0}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    networks:
      - tm20_network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ==========================
  # Celery Worker
  # ==========================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: tm20_celery_worker
    command: celery -A config worker -l info -Q sync,maintenance --concurrency=4
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DEBUG: "0"
      LOG_DIR: /app/logs
      DATABASE_URL: ${DATABASE_URL:-postgres://tm20_user:tm20_password@postgres:5432/tm20_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      C_FORCE_ROOT: "true"
      TM20_TERMINAL_TIMEZONE: ${TM20_TERMINAL_TIMEZONE:-UTC}
    volumes:
      - logs_volume:/app/logs
    networks:
      - tm20_network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ==========================
  # Celery Beat (Scheduler)
  # ==========================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: tm20_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DEBUG: "0"
      LOG_DIR: /app/logs
      DATABASE_URL: ${DATABASE_URL:-postgres://tm20_user:tm20_password@postgres:5432/tm20_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      TM20_TERMINAL_TIMEZONE: ${TM20_TERMINAL_TIMEZONE:-UTC}
    volumes:
      - logs_volume:/app/logs
    networks:
      - tm20_network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # ==========================
  # PostgreSQL Database
  # ==========================
  postgres:
    image: postgres:15-alpine
    container_name: tm20_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tm20_db}
      POSTGRES_USER: ${POSTGRES_USER:-tm20_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tm20_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tm20_network
    restart: unless-stopped

  # ==========================
  # Redis Cache & Message Broker
  # ==========================
  redis:
    image: redis:7-alpine
    container_name: tm20_redis
    volumes:
      - redis_data:/data
    networks:
      - tm20_network
    restart: unless-stopped

# ==========================
# Volumes Persistants
# ==========================
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:

# ==========================
# Networks
# ==========================
networks:
  tm20_network:
    driver: bridge
